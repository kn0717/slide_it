<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide It !! Trailer</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trailer.css">
</head>
<body>
  <div id="stage">
    <div id="gameWrap"><iframe id="game" title="Slide It !! gameplay"></iframe></div>
    <canvas id="fx" width="1920" height="1080"></canvas>

    <div id="story" class="layer"></div>
    <div id="big" class="layer"></div>
    <div id="feature" class="layer"></div>
    <div id="caption" class="layer"><span class="dot"></span><span id="captionText"></span></div>

    <div id="logo" class="layer">
      <div id="logoTitle">Slide It !!</div>
      <div id="tagline">Draw a line. Slide the cube. Reach the portal.</div>
      <div id="cta">Play free in your browser</div>
    </div>

    <div id="vignette"></div>
    <canvas id="wipe" width="1920" height="1080"></canvas>
    <div id="fade"></div>
  </div>

  <button id="playPreview" hidden>Play trailer preview</button>
  <audio id="music" src="music.wav" preload="auto"></audio>
  <script src="trailer.js"></script>
</body>
</html>
